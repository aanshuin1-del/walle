[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "test/fixtures" }]

[lint]
# Raw snarkjs export. A suppression comment inside the file would change its sha256.
ignore = ["contracts/Groth16Verifier.sol"]
